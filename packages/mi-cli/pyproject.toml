[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mi-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "httpx>=0.28.0",
    "miservice-fork>=2.9.3",
    "pydantic>=2.10.0",
    "pycryptodome>=3.21.0",
    "qrcode[pil]>=8.0",
    "requests>=2.32.0",
    "tzlocal>=5.2",
]

[project.scripts]
mi-cli = "mi_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_cli"]
