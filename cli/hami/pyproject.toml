[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homesense-hami-cli"
version = "0.1.0"
description = "HomeSense HAMI CLI source project"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
hami-cli = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hami_cli*"]
