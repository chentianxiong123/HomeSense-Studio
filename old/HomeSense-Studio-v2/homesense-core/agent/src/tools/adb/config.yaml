device:
  ip: "192.168.31.91"
  port: 5555
  adb_path: "adb"
  timeout_ms: 120000

perception:
  ui_tree:
    enabled: true
  ocr:
    enabled: true
    provider: local  # local / api
    api:
      endpoint: ""    # 自定义 OCR API 端点
      api_key: ""    # API Key
  multimodal:
    enabled: false
    provider: disabled

strategy:
  tv:
    text_target_order: [ui_tree, ocr, multimodal]
  phone:
    text_target_order: [ui_tree, ocr]
